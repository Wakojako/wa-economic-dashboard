name: Update and publish dashboard

on:
  # Allows you to click "Run workflow" manually
  workflow_dispatch:

  # 10:00 am Perth time every day
  # GitHub cron uses UTC: 02:00 UTC = 10:00 AWST
  schedule:
    - cron: "0 2 * * *"

  # Rebuild website whenever code is changed on main
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true


jobs:

  # ============================================================
  # 1. UPDATE DATA AND BUILD THE WEBSITE
  # ============================================================

  build:
    runs-on: ubuntu-latest

    env:
      PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up R
        uses: r-lib/actions/setup-r@v2


      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2


      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::rvest
            any::xml2
            any::dplyr
            any::purrr
            any::stringr
            any::tidyr
            any::readr
            any::lubridate
            any::glue
            any::jsonlite
            any::htmltools
            any::httr2
            any::knitr
            any::rmarkdown


      - name: Refresh dashboard data
        run: Rscript R/update_data.R


      # Save the newly calculated summary figures
      # so the email job can use exactly the same data
      - name: Upload email data
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-email-data
          path: data/dashboard_summary.csv
          retention-days: 1


      - name: Render dashboard
        run: quarto render


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site


  # ============================================================
  # 2. PUBLISH WEBSITE
  # ============================================================

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # 3. SEND DAILY EMAIL
  # ============================================================

  notify:
    runs-on: ubuntu-latest
    needs: deploy

    # Send emails only for:
    # 1. the daily scheduled run
    # 2. a manual Run workflow test
    #
    # A normal push to main updates the website but DOES NOT
    # email the mailing list.
    if: >-
      ${{ success() &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch') }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download updated dashboard figures
        uses: actions/download-artifact@v4
        with:
          name: dashboard-email-data
          path: data


      - name: Send daily dashboard email
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}

          # Automatically takes the URL from the successful
          # GitHub Pages deployment above
          DASHBOARD_URL: ${{ needs.deploy.outputs.page_url }}

        run: python scripts/send_daily_email.py
